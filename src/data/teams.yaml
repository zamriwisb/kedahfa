# The fourteen clubs of the A1 Semi-Pro League 2026/27.
#
# Every crest is the club's real logo. To swap one out, drop the new file
# into public/images/teams/ and update the crest path below — the build
# fails if the file is missing.
#
# shortName is capped at four characters by the schema, which is why the
# reserve sides read JDT2/SEL2/NS2/IMG2 rather than the broadcast "JDT II".
- id: jdt-ii
  name: Johor Darul Ta'zim II
  shortName: JDT2
  crest: /images/teams/jdt-ii.png
- id: selangor-ii
  name: Selangor FC II
  shortName: SEL2
  crest: /images/teams/selangor-ii.png
- id: kedah
  # "Kedah FA", not the full "Kedah Football Association": this name is what
  # fixtures and the standings table render, where the long form crowds the
  # row. src/data/club.yaml keeps the full name for the header, footer and
  # page metadata.
  name: Kedah FA
  shortName: KDH
  crest: /images/teams/kedah.png
- id: negeri-sembilan-ii
  name: Negeri Sembilan FC II
  shortName: NS2
  crest: /images/teams/negeri-sembilan-ii.png
- id: usm

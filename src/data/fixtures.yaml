# Kedah's A1 Semi-Pro League 2026/27 schedule, transcribed from the AFL
# fixture list "JADUAL PERTANDINGAN LIGA A1 SEMI-PRO 2026/2027" (kemaskini
# 4 Ogos 2026). That document footers "tertakluk kepada perubahan dari semasa
# ke semasa" — reconfirm against the latest release before relying on a date.
#
# Only Kedah's own matches live here: the site is a club site, and
# src/pages/fixtures.astro renders every entry in this file as a Kedah match
# row. The other clubs' meetings are in the source PDF, not here.
#
# Twenty-six matchweeks, each of the thirteen opponents home and away.
# Kickoffs are the published 4:45 PM and 8:45 PM slots in Malaysian time —
# the +08:00 offset is required, a bare local time renders the wrong hour.
# Cup rounds (Piala FA, Piala Malaysia, MFL Challenge Cup) are published as
# date windows without opponents, so they are not listed until drawn.
#
# Entry shape:
#
# - id: 2026-08-29-imigresen-ii-h  # unique; convention is date-opponent-h/a
#   competition: A1 Semi-Pro League
#   matchweek: 1                   # optional, omit for cup ties
#   date: 2026-08-29T20:45:00+08:00  # the +08:00 offset is required
#   venue: Darul Aman Stadium
#   home: kedah                    # must be a slug from teams.yaml
#   away: imigresen-ii
#   status: scheduled              # scheduled | finished | postponed
#
# An upcoming HOME fixture may also offer actions. Both are optional, and both
# are a site-relative path or an https:// URL. They render only while the
# match is still ahead, and never on an away fixture — an away one carrying
# either fails the build:
#
#   tickets: https://tickets.example.com/kedah-imigresen
#   stream: https://ppv.example.com/kedah-imigresen
#
# !! The two fixtures below currently carry https://example.com placeholders.
# !! Replace them with the club's real ticketing and PPV URLs before launch.
#
# Finished matches carry a score. Scheduled and postponed matches must not:
#
#   status: finished
#   score: { home: 3, away: 2 }
#   report: kedah-edge-imigresen   # optional, a slug from src/content/news/


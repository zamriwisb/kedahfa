# PLACEHOLDER FIXTURES. The A1 Semi-Pro League 2026/27 schedule has not been
# published — these are stand-ins so the fixtures page and homepage strip have
# something to render. Dates, kickoff times and matchweeks are invented, and
# away grounds read "venue TBC" rather than naming a stadium that may be wrong.
# Replace the lot when the real schedule is out.
#
# Kedah plays each of the other eleven clubs once, alternating home and away.
# Every match is `scheduled` with no score, which is what keeps this file
# consistent with the all-zero table in standings.yaml.
#
# Entry shape:
#
# - id: 2026-08-08-jdt-ii-h        # unique; convention is date-opponent-h/a
#   competition: A1 Semi-Pro League
#   matchweek: 1                   # optional, omit for cup ties
#   date: 2026-08-08T20:45:00+08:00  # the +08:00 offset is required
#   venue: Darul Aman Stadium
#   home: kedah                    # must be a slug from teams.yaml
#   away: jdt-ii
#   status: scheduled              # scheduled | finished | postponed
#
# Finished matches carry a score. Scheduled and postponed matches must not:
#
#   status: finished
#   score: { home: 3, away: 2 }
#   report: kedah-edge-selangor    # optional, a slug from src/content/news/


name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Deliberately UTC: proves the Kuala Lumpur date handling is explicit.
    env:
      TZ: UTC

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check and build
        run: npm run build

      - name: Unit tests
        run: npm test

      # Split out of `npm test` so local iteration stays fast. Each case
      # spawns a real `npm run build`, so this step is slow by nature — but
      # it is the only thing that proves bad content fails the build rather
      # than rendering wrong. It must not be dropped to save CI minutes.
      - name: Build-rejects-bad-content tests
        run: npm run test:build

      # The Playwright/accessibility step used to run here. It was removed
      # deliberately: it cost ~3.5 of CI's ~4.5 minutes, and its font-metric
      # cases fetch webfonts, which flaked with NetworkError on the runner and
      # turned pushes red for reasons that had nothing to do with the change.
      #
      # The suite is NOT abandoned — `npm run test:e2e` still exists and still
      # covers navigation, the sliders, the footer and axe accessibility. Run it
      # locally before pushing anything that touches layout, and always before a
      # production cutover. What is gone is only the automatic gate.

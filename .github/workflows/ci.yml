name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Deliberately UTC: proves the Kuala Lumpur date handling is explicit.
    env:
      TZ: UTC

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check and build
        run: npm run build

      - name: Unit tests
        run: npm test

      # Split out of `npm test` so local iteration stays fast. Each case
      # spawns a real `npm run build`, so this step is slow by nature — but
      # it is the only thing that proves bad content fails the build rather
      # than rendering wrong. It must not be dropped to save CI minutes.
      - name: Build-rejects-bad-content tests
        run: npm run test:build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          # test-results/ carries traces and screenshots; playwright-report/ is
          # the browsable HTML. Both are needed to debug a failed run.
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          # Fail loudly rather than uploading an empty artifact — a silent
          # no-op here means a red CI run with nothing to inspect.
          if-no-files-found: error
